// ═══════════════════════════════════════════════════════════════
// COACH DETAILS — update when the role is filled
// ═══════════════════════════════════════════════════════════════
const COACH = { name: "Youth Development Coach", role: "Youth Development & Employability", initials: "YD" };

// ═══════════════════════════════════════════════════════════════
// TARGETS — only edit when benchmarks change
// Weekly KPIs are per week (multiplied by number of weeks in month view)
// Monthly KPIs are per month
// ═══════════════════════════════════════════════════════════════
const TARGETS = {
  ypContacts:             8,   // meaningful contacts per week
  outreachActivities:     1,   // external recruitment / outreach per week
  caseloadSize:           25,  // active caseload
  jobClubSessions:        2,   // per month
  mockInterviews:         1,   // per month
  linkedinSessions:       1,   // per month

// ═══════════════════════════════════════════════════════════════
// SECTIONS — each shows as a card (like the marketing team cards)
// ═══════════════════════════════════════════════════════════════
// Sessions delivered in the period — used as the target for participant updates (KPI 5)
function sessionsDelivered(d) {
  return (d.jobClubSessions || 0) + (d.mockInterviews || 0) + (d.linkedinSessions || 0) +
         (d.portfolioSessions || 0) + (d.careerPlanningSessions || 0) + (d.socialEvents || 0);
}

// KPI options:
//   yesNo    — tick box KPI (done / not done)
//   monthly  — shows the "monthly" tag
//   track    — tracking only, no target or RAG (EET figures)
//   targetFn — target worked out from other figures
//   na       — returns true when the KPI doesn't apply this period (shows N/A)
const SECTIONS = [
  { title: "Caseload & Contact", badge: "01", freq: "Weekly", kpis: [
    { label: "Meaningful young person contacts",       key: "ypContacts",         unit: " contacts" },
    { label: "All interactions on CRM same day",       key: "crmCompliance",      yesNo: true },
    { label: "Action plans updated",                   key: "actionPlansUpdated", yesNo: true },
    { label: "New applicants contacted within 3 days", key: "applicantFollowups", yesNo: true },
  ]},
  { title: "Employability Sessions", badge: "02", freq: "Monthly", kpis: [
    { label: "Job Club sessions delivered",   key: "jobClubSessions",        unit: " sessions", monthly: true },
    { label: "Mock interview session",        key: "mockInterviews",         unit: " sessions", monthly: true },

  ]},

    { label: "Entered employment",             key: "eetEmployment",       track: true },
    { label: "Entered education",              key: "eetEducation",        track: true },
    { label: "Entered training",               key: "eetTraining",         track: true },
    { label: "Interviews secured",             key: "eetInterviews",       track: true },

  ]},
  { title: "Recruitment & Outreach", badge: "05", freq: "Weekly (recruitment periods)", kpis: [
    { label: "External recruitment / outreach activities", key: "outreachActivities", unit: " activities",
      na: d => !d.recruitmentActive && !d.outreachActivities },
  ]},
  { title: "Programme & Review", badge: "06", freq: "Monthly", kpis: [
    { label: "Labour market / opportunities review",   key: "labourMarketReview",  yesNo: true, monthly: true },
    { label: "Participant feedback reviewed",          key: "feedbackReviewDone",  yesNo: true, monthly: true },
    { label: "Youth insight review held",              key: "youthInsightReview",  yesNo: true, monthly: true },
  ]},
];

// ═══════════════════════════════════════════════════════════════
// RAG helpers
// ═══════════════════════════════════════════════════════════════
const RAG = {
  green: { bg: "bg-green-100", text: "text-green-800", bar: "bg-green-500",  label: "On Track"  },
  amber: { bg: "bg-yellow-100",text: "text-yellow-800",bar: "bg-yellow-400", label: "Close"     },
  red:   { bg: "bg-red-100",   text: "text-red-800",   bar: "bg-red-500",    label: "Off Track" },
  grey:  { bg: "bg-gray-100",  text: "text-gray-500",  bar: "bg-gray-200",   label: "N/A"       },
};
function getRag(p) {
  if (p === null || p === undefined) return "grey";
  if (p >= 85) return "green";
  if (p >= 60) return "amber";
  return "red";
}
function calcPct(actual, target) {
  if (!target || actual === null || actual === undefined) return null;
  return Math.min(Math.round((actual / target) * 100), 150);
}
function kpiTarget(k, d, targets) { return k.targetFn ? k.targetFn(d) : targets[k.key]; }
function kpiRag(k, d, targets) {
  if (k.track) return null;                 // tracking only — not scored
  if (k.na && k.na(d)) return "grey";       // doesn't apply this period
  const v = d[k.key];
  if (k.yesNo) return v ? "green" : "red";
  return getRag(calcPct(v, kpiTarget(k, d, targets)));
}

// ═══════════════════════════════════════════════════════════════
// CSV parser
// Sheet has 2 header rows (title + column names) then data.
// Column order (A=0 … Y=24):
//  0 Week                  1 YP Contacts           2 CRM Same-Day Compliance
//  3 Action Plans Updated  4 New Applicant F-ups   5 External Outreach
//  6 Active Caseload Size  7 Job Club              8 Mock Interview
//  9 LinkedIn             10 Portfolio            11 Career Planning
// 12 Social Events        13 Session Updates Posted
// 14 Feedback Review      15 Youth Insight Review 16 Labour Market Review
// 17 Recruitment Period Active
// 18 Entered Employment   19 Entered Education    20 Entered Training
// 21 Interviews Secured   22 Work Experience      23 Other Progression
// 24 EET Progression Review Done
// ═══════════════════════════════════════════════════════════════
function toNum(v) {
  if (v === '' || v === undefined || v === null) return 0;
  return Number(v) || 0;
}
function toBool(v) {
  // TRUE / yes / y / ticked checkbox = done. Any number above 0 also counts as done.
  if (v === '' || v == null) return false;
  const s = String(v).toLowerCase().trim();
  if (['true','yes','y'].includes(s)) return true;
  const n = Number(s);
  return !isNaN(n) && n > 0;
}

// Full CSV parser — handles quoted cells that contain commas or newlines.
function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQ = false;
  const t = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (inQ) {
      if (ch === '"') {
        if (t[i + 1] === '"') { cur += '"'; i++; }
        else { inQ = false; }
      } else { cur += ch; }
    } else {
      if      (ch === '"')  { inQ = true; }
      else if (ch === ',')  { row.push(cur.trim()); cur = ''; }
      else if (ch === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
      else { cur += ch; }
    }
  }
  row.push(cur.trim());
  if (row.some(c => c !== '')) rows.push(row);
  return rows;
}

function loadSheetData(text) {
  const rows = parseCSV(text);
  // rows[0] = title, rows[1] = column headers — skip both
  const dataRows = rows.slice(2).filter(r => r[0]?.trim());
  const weeks = [], data = {};
  dataRows.forEach(c => {
    const wk = c[0]?.trim();
    if (!wk) return;
    weeks.push(wk);
    data[wk] = {
      ypContacts:             toNum(c[1]),
      crmCompliance:          toBool(c[2]),
      actionPlansUpdated:     toBool(c[3]),
      applicantFollowups:     toBool(c[4]),
      outreachActivities:     toNum(c[5]),
      caseloadSize:           (c[6] === '' || c[6] == null || isNaN(Number(c[6]))) ? null : Number(c[6]), // blank = not entered
      jobClubSessions:        toNum(c[7]),
      mockInterviews:         toNum(c[8]),
      linkedinSessions:       toNum(c[9]),
      portfolioSessions:      toNum(c[10]),
      careerPlanningSessions: toNum(c[11]),
      socialEvents:           toNum(c[12]),
      sessionUpdates:         toNum(c[13]),
      feedbackReviewDone:     toBool(c[14]),
      youthInsightReview:     toBool(c[15]),
      labourMarketReview:     toBool(c[16]),
      recruitmentActive:      toBool(c[17]),
      eetEmployment:          toNum(c[18]),
      eetEducation:           toNum(c[19]),
      eetTraining:            toNum(c[20]),
      eetInterviews:          toNum(c[21]),
      eetWorkExperience:      toNum(c[22]),
      eetOther:               toNum(c[23]),
      eetReviewDone:          toBool(c[24]),
    };
  });
  return { weeks, data };
}

// ═══════════════════════════════════════════════════════════════
// Month helpers
// ═══════════════════════════════════════════════════════════════
const MON      = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function getMonthKey(lbl) {
  // Accepts "16 Jun", "16 June", "16 june" — returns 3-letter key or null
  const p = lbl.trim().split(/\s+/);
  if (p.length < 2) return null;
  const m = p[p.length - 1];
  if (MON.includes(m)) return m;
  const fi = MON_FULL.findIndex(n => n.toLowerCase() === m.toLowerCase());
  return fi >= 0 ? MON[fi] : null;
}
function monthName(mk) { const i = MON.indexOf(mk); return i >= 0 ? MON_FULL[i] : mk; }
function getMonths(weeks) {
  const seen = new Set(), out = [];
  for (const w of weeks) { const m = getMonthKey(w); if (m && !seen.has(m)) { seen.add(m); out.push(m); } }
  return out;
}
function aggregateMonth(mWeeks, data) {
  const rows = mWeeks.map(w => data[w]).filter(Boolean);
  if (!rows.length) return null;
  const sum = k => rows.reduce((s, r) => s + (r[k] || 0), 0);
  return {
    ypContacts:             sum('ypContacts'),
    crmCompliance:          rows.every(r => r.crmCompliance),       // must be done every week
    actionPlansUpdated:     rows.every(r => r.actionPlansUpdated),
    applicantFollowups:     rows.every(r => r.applicantFollowups),
    outreachActivities:     sum('outreachActivities'),
    caseloadSize:           [...rows].reverse().find(r => r.caseloadSize !== null)?.caseloadSize ?? null, // latest figure entered
    jobClubSessions:        sum('jobClubSessions'),
    mockInterviews:         sum('mockInterviews'),
    linkedinSessions:       sum('linkedinSessions'),
    portfolioSessions:      sum('portfolioSessions'),
    careerPlanningSessions: sum('careerPlanningSessions'),
    socialEvents:           sum('socialEvents'),
    sessionUpdates:         sum('sessionUpdates'),
    feedbackReviewDone:     rows.some(r => r.feedbackReviewDone),
    youthInsightReview:     rows.some(r => r.youthInsightReview),
    labourMarketReview:     rows.some(r => r.labourMarketReview),
    recruitmentActive:      rows.some(r => r.recruitmentActive),
    eetEmployment:          sum('eetEmployment'),
    eetEducation:           sum('eetEducation'),
    eetTraining:            sum('eetTraining'),
    eetInterviews:          sum('eetInterviews'),
    eetWorkExperience:      sum('eetWorkExperience'),
    eetOther:               sum('eetOther'),
    eetReviewDone:          rows.some(r => r.eetReviewDone),
    _n:                     rows.length,
  };
}
function monthTargets(n) {
  const t = { ...TARGETS };
  WEEKLY_KEYS.forEach(k => { t[k] = TARGETS[k] * n; });
  return t;
}

// ═══════════════════════════════════════════════════════════════
// Components
// ═══════════════════════════════════════════════════════════════

function StatCard({ emoji, label, value, target, sub }) {
  const missing = value === null || value === undefined;
  const p = missing ? null : calcPct(value, target);
  const key = getRag(p);
  const col = missing ? "text-gray-500" : key === "green" ? "text-green-400" : key === "amber" ? "text-yellow-400" : "text-red-400";
  return (
    <div className="bg-black rounded-2xl px-5 py-4 flex items-center justify-between flex-1">
      <div>
        <div className="flex items-center gap-2 mb-1">
          <span className="text-base">{emoji}</span>
          <span className="text-gray-400 text-xs font-semibold uppercase tracking-wider">{label}</span>
        </div>
        <div className="text-white font-black text-2xl leading-none">{missing ? "—" : value}</div>
        <div className="text-gray-500 text-xs mt-1">{missing ? "not entered for this week" : sub}</div>
      </div>
      <div className={`text-right ${col}`}>
        <div className="text-xl font-black leading-none">{missing ? "—" : `${p}%`}</div>
        <div className="text-xs font-semibold mt-0.5">of {target} target</div>
      </div>
    </div>
  );
}

function KpiRow({ label, actual, target, unit = "", yesNo = false, val = null, monthly = false, na = false, track = false }) {
  // Tracking-only row (EET figures) — number, no target or RAG
  if (track) {
    return (
      <div className="flex items-center gap-3 py-2.5 border-b border-gray-50 last:border-0">
        <div className="flex-1 min-w-0">
          <span className="text-sm text-gray-700">{label}</span>
        </div>
        <span className="text-lg font-black text-gray-900 w-10 text-right">{actual ?? 0}</span>
        <span className="text-xs px-2 py-0.5 rounded-full font-semibold whitespace-nowrap bg-gray-100 text-gray-500">Tracking</span>
      </div>
    );
  }
  let p, display;
  if (na) {
    p = null;
    display = "— not applicable this period";
  } else if (yesNo) {
    p = val ? 100 : 0;
    display = val ? "✓  Done" : "✗  Not done";
  } else {
    p = calcPct(actual, target);
    display = actual !== null && actual !== undefined ? `${actual}${unit}  /  ${target}${unit}` : "— not entered";
  }
  const key = getRag(p);
  const c = RAG[key];
  return (
    <div className="flex items-center gap-3 py-2.5 border-b border-gray-50 last:border-0">
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5 flex-wrap">
          <span className="text-sm text-gray-700">{label}</span>
          {monthly && <span className="text-xs text-gray-400 bg-gray-100 rounded px-1.5 py-0.5">monthly</span>}
        </div>
        <div className={`text-xs font-semibold mt-0.5 ${c.text}`}>{display}</div>
      </div>
      <div className="flex items-center gap-2 shrink-0">
        <div className="w-16 h-1.5 rounded-full bg-gray-100">
          <div className={`h-1.5 rounded-full bar-fill ${c.bar}`} style={{ width: `${Math.min(p ?? 0, 100)}%` }} />
        </div>
        <span className={`text-xs px-2 py-0.5 rounded-full font-semibold whitespace-nowrap ${c.bg} ${c.text}`}>{c.label}</span>
      </div>
    </div>
  );
}

function SectionCard({ sec, d, targets }) {
  const [open, setOpen] = useState(true);
  // Only score KPIs that apply (skip tracking-only and N/A)
  const rags = sec.kpis.map(k => kpiRag(k, d, targets)).filter(r => r && r !== "grey");
  const onTrack = rags.filter(r => r === "green").length;
  const overall = !rags.length ? "grey" : rags.includes("red") ? "red" : rags.includes("amber") ? "amber" : "green";
  const c = RAG[overall];
  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <button onClick={() => setOpen(o => !o)}
        className="w-full bg-black px-5 py-4 flex items-center justify-between gap-3 text-left hover:bg-gray-900 transition-colors">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-full bg-yellow-400 flex items-center justify-center text-black font-black text-sm shrink-0">{sec.badge}</div>
          <div>
            <div className="text-white font-bold text-sm leading-tight">{sec.title}</div>
            <div className="text-gray-400 text-xs mt-0.5">{sec.freq} · {sec.kpis.length} KPIs</div>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <span className={`text-xs font-bold px-2 py-1 rounded-full ${c.bg} ${c.text}`}>{rags.length ? `${onTrack}/${rags.length} on track` : "N/A"}</span>
          <span className="text-gray-600 text-sm">{open ? "▲" : "▼"}</span>
        </div>
      </button>
      {open && (
        <div className="px-5 py-2">
          {sec.kpis.map((k, i) => (
            <KpiRow key={i} label={k.label} unit={k.unit} monthly={k.monthly}
              yesNo={k.yesNo} val={k.yesNo ? d[k.key] : null} track={k.track}
              na={!!(k.na && k.na(d))}
              actual={k.yesNo ? null : d[k.key]} target={kpiTarget(k, d, targets)} />
          ))}
        </div>
      )}
    </div>
  );
}

function Health({ d, targets, view }) {
  // Week view: weekly KPIs only. Month view: every KPI.
  // Skips tracking-only and not-applicable KPIs
  const rags = SECTIONS
    .filter(s => view === "month" || s.freq.startsWith("Weekly"))
    .flatMap(s => s.kpis)
    .map(k => kpiRag(k, d, targets))
    .filter(r => r && r !== "grey");
  const met = rags.filter(r => r === "green").length;
  const total = rags.length;
  const pct = total ? Math.round((met / total) * 100) : 0;
  const key = pct >= 85 ? "green" : pct >= 60 ? "amber" : "red";
  const c = RAG[key];
  return (
    <div className={`rounded-2xl px-5 py-4 flex items-center justify-between ${c.bg}`}>
      <div>
        <div className={`text-xs font-bold uppercase tracking-wider ${c.text}`}>{view === "month" ? "Month Health" : "Week Health"}</div>
        <div className={`text-3xl font-black mt-1 ${c.text}`}>{pct}%</div>
        <div className={`text-xs mt-1 ${c.text} opacity-80`}>
          {met} of {total} {view === "month" ? "KPIs met this month" : "weekly KPIs met this week"}
        </div>
      </div>
      <svg viewBox="0 0 36 36" className="w-16 h-16 -rotate-90">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(0,0,0,0.1)" strokeWidth="3.5"/>
        <circle cx="18" cy="18" r="15.9" fill="none" strokeWidth="3.5"
          strokeDasharray={`${pct} ${100 - pct}`} strokeLinecap="round"
          className={key === "green" ? "stroke-green-600" : key === "amber" ? "stroke-yellow-500" : "stroke-red-500"}
        />
      </svg>
    </div>
  );
}

            </div>
          </div>
        ))}
      </div>

      {/* Weekly routine */}
      <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm space-y-3">
        <p className="font-bold text-sm text-gray-800">Every week (takes ~2 mins)</p>
        <ol className="text-sm text-gray-600 space-y-2 list-decimal list-inside">
          <li>Open the Google Sheet using the button above.</li>

          <li>Type the counts in the number columns and tick the boxes for anything done.</li>
          <li>Tick <strong>Recruitment Period Active</strong> in weeks when the programme is recruiting — outreach is only scored in those weeks.</li>
          <li>Monthly KPIs (sessions, events, reviews, EET progressions) — enter them in the week they happened.</li>
          <li>Hover over any column header in the sheet to see exactly what to count.</li>
          <li>Done — refresh the dashboard to see the update.</li>
        </ol>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Main App
// ═══════════════════════════════════════════════════════════════
function App() {
  const [weeks, setWeeks]   = useState([]);
  const [data, setData]     = useState({});
  const [week, setWeek]     = useState(null);
  const [month, setMonth]   = useState(null);
  const [view, setView]     = useState("week");
  const [tab, setTab]       = useState("output");
  const [status, setStatus] = useState("loading");

  useEffect(() => {
    if (!SHEET_CSV_URL) { setStatus("nourl"); return; }
    fetch(SHEET_CSV_URL)
      .then(r => { if (!r.ok) throw new Error("fetch"); return r.text(); })
      .then(text => {
        const { weeks: w, data: dd } = loadSheetData(text);
        if (!w.length) throw new Error("empty");
        setWeeks(w);
        setData(dd);
        // Default to the most recent week on or before today
        const today = new Date(); today.setHours(0,0,0,0);
        const toDate = lbl => {
          const mk = getMonthKey(lbl);
          if (!mk) return null;
          const yr = today.getFullYear();
          const dt = new Date(yr, MON.indexOf(mk), parseInt(lbl, 10));
          if (dt - today > 183 * 86400000) dt.setFullYear(yr - 1);
          return dt;
        };
        let best = w[0];
        for (const wk of w) { const dt = toDate(wk); if (dt && dt <= today) best = wk; }
        setWeek(best);
        setMonth(getMonthKey(best));
        setStatus("ok");
      })
      .catch(e => setStatus(e.message === "empty" ? "empty" : "error"));
  }, []);

  const months = useMemo(() => getMonths(weeks), [weeks]);

  const d = useMemo(() => {
    if (view === "week") return week ? data[week] : null;
    return month ? aggregateMonth(weeks.filter(w => getMonthKey(w) === month), data) : null;
  }, [view, week, month, weeks, data]);

  const targets = view === "month" && d?._n ? monthTargets(d._n) : TARGETS;

  // Navigation (weeks or months depending on view)
  const list  = view === "week" ? weeks : months;
  const cur   = view === "week" ? week  : month;
  const setCur = view === "week" ? setWeek : setMonth;
  const idx   = list.indexOf(cur);
  const label = view === "week" ? `w/c ${week || ""}` : monthName(month || "");

  return (
    <div className="min-h-screen bg-gray-50">

      {/* Nav */}
      <div className="bg-black px-5 py-4 flex items-center justify-between gap-3 flex-wrap">
        <div>
          <span className="text-yellow-400 font-black text-lg tracking-tight">TRASH | G✕NG</span>
          <span className="text-gray-500 text-xs ml-3 hidden sm:inline">Youth Development KPI Tracker</span>
        </div>
        {weeks.length > 0 && (
          <div className="flex items-center gap-2">
            <div className="flex bg-gray-800 rounded-lg p-0.5">
              {[["week","Week"],["month","Month"]].map(([id, lbl]) => (
                <button key={id} onClick={() => setView(id)}
                  className={`px-3 py-1 text-xs font-bold rounded-md transition-colors ${view === id ? "bg-yellow-400 text-black" : "text-gray-400 hover:text-white"}`}>
                  {lbl}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-1 bg-gray-800 rounded-lg px-2 py-1.5">
              <button onClick={() => { if (idx > 0) setCur(list[idx - 1]); }}
                className={`px-2 text-lg font-bold leading-none transition-colors ${idx > 0 ? "text-gray-400 hover:text-yellow-400" : "text-gray-700 cursor-default"}`}>‹</button>
              <span className="text-white text-sm font-medium w-28 text-center">{label}</span>
              <button onClick={() => { if (idx < list.length - 1) setCur(list[idx + 1]); }}
                className={`px-2 text-lg font-bold leading-none transition-colors ${idx < list.length - 1 ? "text-gray-400 hover:text-yellow-400" : "text-gray-700 cursor-default"}`}>›</button>
            </div>
          </div>
        )}
      </div>

      {/* Tabs */}
      <div className="bg-white border-b border-gray-200 px-5">
        <div className="flex gap-5">
          {[["output","Coach Output"],["howto","How to Update"]].map(([id, lbl]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`py-3 text-sm font-bold border-b-2 transition-colors ${tab === id ? "border-yellow-400 text-black" : "border-transparent text-gray-400 hover:text-gray-700"}`}>
              {lbl}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 py-5 space-y-4">

        {tab === "output" && (
          <>
            {status === "loading" && (
              <div className="flex flex-col items-center justify-center py-24 space-y-4 text-gray-400">
                <div className="w-8 h-8 border-4 border-yellow-400 border-t-transparent rounded-full spin" />
                <p className="text-sm">Loading from Google Sheets…</p>
              </div>
            )}
            {status === "nourl" && (
              <div className="bg-yellow-50 border-2 border-dashed border-yellow-400 rounded-2xl p-8 text-center space-y-2">
                <div className="text-3xl">📊</div>
                <div className="font-bold text-yellow-800">Google Sheet not connected</div>
                <div className="text-yellow-600 text-sm">Add the Apps Script web app URL to SHEET_CSV_URL at the top of this file.</div>
              </div>
            )}
            {status === "error" && (
              <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-6 text-center space-y-3">
                <div className="text-3xl">⚠️</div>
                <div className="font-bold text-red-800">Couldn't connect to Google Sheet</div>
                <div className="text-red-600 text-sm">Check the Apps Script is deployed as a web app with access set to <strong>Anyone</strong>.</div>
                <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer"
                  className="inline-block mt-1 bg-red-600 hover:bg-red-700 text-white text-sm font-bold px-4 py-2 rounded-xl transition-colors">
                  Open Google Sheet →
                </a>
              </div>
            )}
            {status === "empty" && (
              <div className="bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-6 text-center space-y-3">
                <div className="text-3xl">📋</div>
                <div className="font-bold text-yellow-800">Sheet is connected but has no data yet</div>
                <div className="text-yellow-700 text-sm">Add at least one week of data to the Google Sheet (row 3 onwards) and refresh this page.</div>
                <a href={SHEET_EDIT_URL} target="_blank" rel="noopener noreferrer"
                  className="inline-block mt-1 bg-yellow-500 hover:bg-yellow-600 text-white text-sm font-bold px-4 py-2 rounded-xl transition-colors">
                  Open Google Sheet →
                </a>
              </div>
            )}
            {status === "ok" && d && (
              <>
                {/* Coach */}
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 px-5 py-4 flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center text-black font-black text-sm shrink-0">{COACH.initials}</div>
                  <div>
                    <div className="font-bold text-sm text-gray-900">{COACH.name}</div>
                    <div className="text-xs text-gray-500">{COACH.role}</div>
                  </div>
                </div>

                {/* Headline stats */}
                <div className="flex gap-3 flex-col sm:flex-row">
                  <StatCard emoji="🧑🏾‍🤝‍🧑🏽" label="YP Contacts" value={d.ypContacts} target={targets.ypContacts}
                    sub={view === "month" ? "meaningful contacts this month" : "meaningful contacts this week"} />
                  <StatCard emoji="📁" label="Active Caseload" value={d.caseloadSize} target={TARGETS.caseloadSize}
                    sub="young people on caseload" />
                </div>

                <Health d={d} targets={targets} view={view} />

                {SECTIONS.map(sec => <SectionCard key={sec.title} sec={sec} d={d} targets={targets} />)}

                <div className="flex flex-wrap gap-4 justify-center pt-1 pb-4">
                  {["green","amber","red"].map(k => (
                    <div key={k} className="flex items-center gap-1.5 text-xs text-gray-500">
                      <div className={`w-2 h-2 rounded-full ${RAG[k].bar}`} />
                      {RAG[k].label}
                    </div>
                  ))}
                  <div className="flex items-center gap-1.5 text-xs text-gray-500">
                    <span className="bg-gray-100 text-gray-400 rounded px-1.5 py-0.5 text-xs">monthly</span>
                    Monthly KPI
                  </div>
                </div>
              </>
            )}
          </>
        )}

        {tab === "howto" && <HowToUpdate />}
      </div>

      <div className="text-center text-xs text-gray-400 pb-8 mt-4">
        Trash Gxng Academy CIC · Youth Development KPI Tracker
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
